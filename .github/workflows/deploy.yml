name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you re-deploy the current main without pushing an empty commit.
  workflow_dispatch:

# A newer push to main supersedes an in-flight deploy; never run two at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # util/blog-index.generated.ts is generated, not committed, so it has to
      # exist before anything reads the types. pretypecheck/prebuild both build
      # it; this makes the dependency obvious in the log.
      - run: npm run blog:index

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build worker
        run: npm run cf:build

      # `deploy` also runs populateCache, which copies the prerendered pages
      # into the assets bundle. Without it every route re-renders at request
      # time and MDX compilation fails — Workers blocks Shiki's WASM engine.
      - name: Deploy
        id: deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
